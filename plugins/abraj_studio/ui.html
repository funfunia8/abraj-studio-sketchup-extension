<script>
    function generateCabinet() {
        const width = document.getElementById('width').value;
        const height = document.getElementById('height').value;
        const depth = document.getElementById('depth').value;
        const material = document.getElementById('material').value;
        const edgeBand = document.getElementById('edgeBand').value;
        const doorType = document.getElementById('doorType').value;
        const shelfCount = document.getElementById('shelfCount').value;

        if (!width || !height || !depth) {
            showStatus('Please fill in all dimension fields', 'error');
            return;
        }

        const data = {
            width: width,
            height: height,
            depth: depth,
            material: material,
            edgeBand: edgeBand,
            doorType: doorType,
            shelfCount: shelfCount
        };

        const payload = encodeURIComponent(JSON.stringify(data));
        window.location = 'skp:generateCabinet@' + payload;
    }

    function showStatus(message, type = 'success') {
        const statusDiv = document.getElementById('status');
        statusDiv.textContent = message;
        statusDiv.className = 'status show ' + type;
    }
</script>
