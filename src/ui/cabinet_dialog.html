<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABRAJ STUDIO - Cabinet Designer</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --panel-2: #1f2937;
            --gold: #d4af7c;
            --text: #f5f5f5;
            --muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(180deg, var(--bg), #111827 100%);
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            color: var(--gold);
            font-size: 2rem;
            letter-spacing: 0.1em;
        }

        .header p {
            margin: 5px 0 0 0;
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(212, 175, 124, 0.3);
            border-radius: 14px;
            padding: 20px;
        }

        .panel h2 {
            margin-top: 0;
            color: var(--gold);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: var(--panel-2);
            color: var(--text);
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 5px rgba(212, 175, 124, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--gold);
            color: var(--bg);
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
        }

        .output-panel {
            grid-column: 1 / -1;
        }

        #output {
            min-height: 200px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(212, 175, 124, 0.24);
            border-radius: 10px;
            padding: 16px;
            color: #dfe7ea;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 400px;
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            background: rgba(212, 175, 124, 0.1);
            border-left: 3px solid var(--gold);
            border-radius: 4px;
            color: var(--gold);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ABRAJ STUDIO</h1>
            <p>SketchUp Furniture Extension</p>
        </div>

        <div class="grid">
            <div class="panel">
                <h2>Cabinet Dimensions</h2>
                <div class="form-group">
                    <label>Width (mm)</label>
                    <input type="number" id="width" value="600" min="100" max="2000">
                </div>
                <div class="form-group">
                    <label>Height (mm)</label>
                    <input type="number" id="height" value="900" min="100" max="2500">
                </div>
                <div class="form-group">
                    <label>Depth (mm)</label>
                    <input type="number" id="depth" value="600" min="100" max="1000">
                </div>
                <div class="form-group">
                    <label>Thickness (mm)</label>
                    <input type="number" id="thickness" value="18" min="6" max="50">
                </div>
            </div>

            <div class="panel">
                <h2>Materials & Hardware</h2>
                <div class="form-group">
                    <label>Material</label>
                    <select id="material">
                        <option>MDF</option>
                        <option>MDF Moisture Resistant</option>
                        <option>HDF</option>
                        <option>Plywood</option>
                        <option>Melamine</option>
                        <option>Oak</option>
                        <option>Walnut</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Edge Band</label>
                    <select id="edge_band">
                        <option>PVC 2mm</option>
                        <option>ABS 2mm</option>
                        <option>Wood 2mm</option>
                        <option>Leather</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Door Type</label>
                    <select id="door_type">
                        <option>Panel</option>
                        <option>Flush</option>
                        <option>Glass</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Hinge Type</label>
                    <select id="hinge_type">
                        <option>Standard</option>
                        <option>Soft Close</option>
                        <option>Half Overlay</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Handle Type</label>
                    <select id="handle_type">
                        <option>Recessed</option>
                        <option>External Round</option>
                        <option>External Straight</option>
                        <option>Hidden</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Shelf Count</label>
                    <input type="number" id="shelf_count" value="1" min="0" max="10">
                </div>
            </div>

            <div class="panel output-panel">
                <h2>Output & Exports</h2>
                <div class="button-group">
                    <button onclick="generateCabinet()">Generate Cabinet</button>
                    <button class="secondary" onclick="exportCutList()">Export Cut List</button>
                    <button class="secondary" onclick="exportBOM()">Export BOM</button>
                    <button class="secondary" onclick="exportDXF()">Export DXF</button>
                </div>
                <div id="output">Ready to generate cabinet...</div>
                <div class="status" id="status" style="display:none;">Operation completed</div>
            </div>
        </div>
    </div>

    <script>
        function updateOutput(message) {
            document.getElementById('output').textContent = message;
            showStatus();
        }

        function updateCutList(data) {
            console.log('Cut List:', data);
        }

        function updateBOM(data) {
            console.log('BOM:', data);
        }

        function showStatus() {
            const status = document.getElementById('status');
            status.style.display = 'block';
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        function generateCabinet() {
            const data = {
                width: document.getElementById('width').value,
                height: document.getElementById('height').value,
                depth: document.getElementById('depth').value,
                thickness: document.getElementById('thickness').value,
                material: document.getElementById('material').value,
                edge_band: document.getElementById('edge_band').value,
                door_type: document.getElementById('door_type').value,
                hinge_type: document.getElementById('hinge_type').value,
                handle_type: document.getElementById('handle_type').value,
                shelf_count: document.getElementById('shelf_count').value
            };

            if (window.sketchup) {
                window.sketchup.generateCabinet(JSON.stringify(data));
            }
        }

        function exportCutList() {
            if (window.sketchup) {
                window.sketchup.exportCutList();
            }
        }

        function exportBOM() {
            if (window.sketchup) {
                window.sketchup.exportBOM();
            }
        }

        function exportDXF() {
            if (window.sketchup) {
                window.sketchup.exportDXF();
            }
        }
    </script>
</body>
</html>
